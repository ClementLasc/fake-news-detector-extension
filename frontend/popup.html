<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pop-up-UX-UI">
    <div class="div">
      <div class="brand-and-logo">
        <div class="overlap-group">
          <p class="apollo">
            <span class="text-wrapper">Apollo<br /></span>
            <span class="span">Misinformation Detector</span>
          </p>
          <div class="logo">
            <div class="ellipse"></div>
          </div>
        </div>
      </div>
      <div class="description">
        <p class="p">Use the button below to control monitoring:</p>
      </div>
      <div class="toggle-switch-container">
        <div class="text-wrapper-5">Status: Disabled</div>
        <div class="toggle-switch">
          <div class="ellipse-wrapper">
            <div class="ellipse-2"></div>
          </div>
        </div>
        <div class="text-wrapper-4">Enable Monitoring</div>
        <div class="progress-container" style="display: none;">
          <div class="progress-bar"></div>
        </div>
      </div>
      <div class="footer">
          <button class="settings-button" aria-label="Settings">
            <img class="settings" src="settings.png" alt="" />
            <span class="text-wrapper-3">Settings</span>
          </button>
          <button class="question-mark-button" aria-label="About">
            <img class="question-mark" src="settings.png" alt="" />
            <span class="text-wrapper-2">About</span>
          </button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
