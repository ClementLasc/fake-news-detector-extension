economic:
  indicators:
    - pattern: '[{"POS": {"IN": ["ADJ", "NOUN"]}, "OP": "*"}, {"LOWER": {"in": ["economy", "economic", "finance", "financial", "gdp", "gnp", "growth", "market", "stock", "trade", "investment", "debt", "loan", "revenue", "profit", "loss", "inflation", "deflation", "recession", "depression", "boom", "bust", "bubble", "bailout", "stimulus", "austerity", "budget", "deficit", "surplus", "tax", "tariff", "interest rate", "exchange rate", "unemployment", "employment", "wage", "salary", "income", "poverty", "inequality", "supply", "demand", "production", "consumption", "consumer confidence", "business confidence", "manufacturing", "services", "industry", "sector"]}}]'
    - pattern: '[{"LOWER": {"in": ["significant", "substantial", "massive", "major", "minor", "moderate", "slight", "gradual", "sharp", "steep", "rapid", "slow"]}}, {"LOWER": {"in": ["increase", "decrease", "decline", "rise", "fall", "growth", "contraction", "expansion", "surge", "drop", "jump", "spike", "plunge", "slump"]}}, {"LOWER": "in", "OP": "?"}, {"POS": {"IN": ["ADJ", "NOUN"]}, "OP": "*"}, {"LOWER": {"in": ["economy", "economic", "finance", "financial", "gdp", "gnp", "growth", "market", "stock", "trade", "investment", "debt", "loan", "revenue", "profit", "loss", "inflation", "deflation", "recession", "depression", "interest rate", "unemployment", "employment", "wage", "salary", "income"]}}]'
    - pattern: '[{"LOWER": {"in": ["soar", "skyrocket", "plummet", "collapse", "surge", "spike", "plunge", "slump", "explode", "crash"]}}, {"POS": {"IN": ["ADJ", "NOUN"]}, "OP": "*"}, {"LOWER": {"in": ["economy", "economic", "finance", "financial", "gdp", "gnp", "growth", "market", "stock", "trade", "investment", "debt", "loan", "revenue", "profit", "loss", "inflation", "deflation", "recession", "depression", "interest rate", "unemployment", "employment"]}}]'
  phrases:
    - "significant increase in gdp"
    - "major decline in stock market"
    - "soaring inflation rates"
    - "housing market bubble"
    - "trade deficit reduction"
    - "rising unemployment figures"
    - "bull market rally"
    - "bear market decline"
    - "quantitative easing"
    - "fiscal stimulus package"
    - "economic recovery plan"

